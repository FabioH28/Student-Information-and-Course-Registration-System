services:
  db:
    image: mysql:8.0
    container_name: cis-db
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: cis
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/database/mysql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./backend/database/mysql/02_seed_reference.sql:/docker-entrypoint-initdb.d/02_seed_reference.sql:ro
      - ./backend/database/mysql/03_views.sql:/docker-entrypoint-initdb.d/03_views.sql:ro
      - ./backend/database/mysql/04_seed_core_data.sql:/docker-entrypoint-initdb.d/04_seed_core_data.sql:ro
      - ./backend/database/mysql/05_seed_epoka_catalog.sql:/docker-entrypoint-initdb.d/05_seed_epoka_catalog.sql:ro
      - ./backend/database/mysql/06_seed_umt_msc_catalog.sql:/docker-entrypoint-initdb.d/06_seed_umt_msc_catalog.sql:ro
      - ./backend/database/mysql/07_normalize_catalog_identity.sql:/docker-entrypoint-initdb.d/07_normalize_catalog_identity.sql:ro
      - ./backend/database/mysql/08_migrate_rbac_roles.sql:/docker-entrypoint-initdb.d/08_migrate_rbac_roles.sql:ro
      - ./backend/database/mysql/09_seed_demo_users.sql:/docker-entrypoint-initdb.d/09_seed_demo_users.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
    container_name: cis-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: development
      DATABASE_URL: mysql+pymysql://root:root@db:3306/cis
      JWT_SECRET_KEY: change-me-in-compose
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 14
      PASSWORD_RESET_TOKEN_EXPIRE_MINUTES: 30
      LOGIN_LOCKOUT_THRESHOLD: 5
      LOGIN_LOCKOUT_MINUTES: 15
      ENABLE_DEV_RESET_TOKEN_PREVIEW: "true"
      ALLOWED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      args:
        VITE_API_BASE_URL: http://localhost:8000/api/v1
    container_name: cis-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  mysql_data:
